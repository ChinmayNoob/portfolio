<!--
  Email figure for the QR panel on /contact: holding up an envelope.

  Carries a-foreground's original expression, the two dot eyes and small open
  mouth. Given the smallest head and the widest lean of the four so it reads as
  its own character rather than a recolour of the others.

  Authored for the always-light panel, so there is no dark pair.
-->
<svg width="304" height="304" viewBox="0 0 304 304" fill="none" xmlns="http://www.w3.org/2000/svg">
<g transform="rotate(-8 152 176)">
  <!-- silhouette: stroked at double width, then repainted fill-only, so only
       the outer contour survives and there is no head/shoulder seam -->
  <g stroke="var(--background-l3)" stroke-width="4">
    <path d="M106 264L112 200C114 184 128 172 150 172C172 172 188 184 190 200L196 264Z" fill="var(--accent-l1)"/>
    <circle cx="150" cy="120" r="46" fill="var(--accent-l0)"/>
  </g>
  <path d="M106 264L112 200C114 184 128 172 150 172C172 172 188 184 190 200L196 264Z" fill="var(--accent-l1)"/>
  <circle cx="150" cy="120" r="46" fill="var(--accent-l0)"/>

  <!-- a-foreground's face: dot eyes and a small open mouth -->
  <circle cx="137" cy="114" r="3.6" fill="var(--foreground-l2)"/>
  <circle cx="163" cy="112" r="3.6" fill="var(--foreground-l2)"/>
  <path d="M143.5 128H156.5V134.5C156.5 139 153.6 142.5 150 142.5C146.4 142.5 143.5 139 143.5 134.5Z" stroke="var(--foreground-l2)" stroke-width="2" stroke-linejoin="round"/>

  <!-- envelope, tilted against the body lean -->
  <g transform="rotate(7 151 223)" stroke="var(--foreground-l2)" stroke-linejoin="round">
    <rect x="118" y="200" width="66" height="46" rx="4" fill="var(--background-l0)" stroke-width="2.5"/>
    <path d="M122 205L151 228L180 205" stroke-width="3" stroke-linecap="round"/>
  </g>
</g>
</svg>
