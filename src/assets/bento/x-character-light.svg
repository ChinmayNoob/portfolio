<!--
  X figure for the QR panel on /contact. Redrawn from k-foreground: same annoyed
  brows, ring eye, anger marks, raised phone and pair of birds, but the phone's
  solid grey mass is now a light fill with dark linework.

  That conversion is the whole constraint. A large dark shape turns the QR
  code's LIGHT modules dark, and src/lib/qr/render.ts cannot measure that kind
  of damage — it only counts dark modules it removed. The original artwork
  failed to decode for exactly this reason. The birds stay solid dark because
  they are tiny, on the scale of the eyes.

  Authored for the always-light panel, so there is no dark pair.
-->
<svg width="304" height="304" viewBox="0 0 304 304" fill="none" xmlns="http://www.w3.org/2000/svg">
<g transform="rotate(3 152 170)">
  <g stroke="var(--background-l3)" stroke-width="4">
    <path d="M100 264L108 196C110 180 128 168 156 168C184 168 200 180 202 196L210 264Z" fill="var(--accent-l1)"/>
    <circle cx="156" cy="112" r="54" fill="var(--accent-l0)"/>
  </g>
  <path d="M100 264L108 196C110 180 128 168 156 168C184 168 200 180 202 196L210 264Z" fill="var(--accent-l1)"/>
  <circle cx="156" cy="112" r="54" fill="var(--accent-l0)"/>

  <!-- hairline, and the anger marks that sell the expression -->
  <g stroke="var(--background-l6)" stroke-width="2.5" stroke-linecap="round">
    <path d="M191 82C203 95 205 117 197 134"/>
    <path d="M199 62C207 66 211 74 209 82"/>
    <path d="M207 55C217 60 223 71 220 82"/>
    <path d="M215 49C227 55 234 69 230 83"/>
  </g>

  <!-- annoyed face: two hard brows around one wide ring eye -->
  <g stroke="var(--foreground-l2)" stroke-linecap="round">
    <path d="M130 98L146 107" stroke-width="4"/>
    <path d="M182 98L166 107" stroke-width="4"/>
    <circle cx="156" cy="118" r="5.5" stroke-width="2.5"/>
  </g>

  <!-- raised phone -->
  <g transform="rotate(-20 110 190)" stroke="var(--foreground-l2)" stroke-linejoin="round">
    <rect x="91" y="152" width="38" height="74" rx="8" fill="var(--background-l0)" stroke-width="2.5"/>
    <rect x="96" y="158" width="17" height="17" rx="4.5" stroke-width="2"/>
    <g fill="var(--foreground-l2)" stroke="none">
      <circle cx="101.5" cy="163.5" r="2.1"/>
      <circle cx="107.5" cy="163.5" r="2.1"/>
      <circle cx="101.5" cy="169.5" r="2.1"/>
    </g>
  </g>

  <!-- birds -->
  <g fill="var(--foreground-l2)">
    <path transform="translate(66 142) scale(1.3)" d="M0 0C2.5-4.5 6-5.5 9-3.5C7-1.5 6.5 1 6.5 3.5C4 1.5 2 0.8 0 0Z"/>
    <path transform="translate(84 124) scale(1.05)" d="M0 0C2.5-4.5 6-5.5 9-3.5C7-1.5 6.5 1 6.5 3.5C4 1.5 2 0.8 0 0Z"/>
  </g>
</g>
</svg>
